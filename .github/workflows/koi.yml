name: Living Git-Koi

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Draw Koi from Commit Stream
        uses: yalongwastaken/git-koi@v1
        with:
          login: AbinVarghexe
          body: platinum
          output-dir: koi

      - name: Commit Koi Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add koi/koi.gif koi/koi.png koi/preview.html
          git diff --staged --quiet || git commit -m "chore: redraw living koi"
          git push
