name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D Contribution Calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Harmonize Palette & Strip Background/Text
        run: |
          python3 -c "
          import os, re
          p = 'profile-3d-contrib/profile-night-view.svg'
          if os.path.exists(p):
              c = open(p).read()
              c = c.replace('#f1e05a', '#7DA3F6').replace('#e34c26', '#3B82F6').replace('rgb(255,200,55)', '#7DA3F6').replace('#00B4AB', '#38BDF8')
              c = re.sub(r'<rect [^>]*fill=\"(?:#070A10|#00000f|#000|none)\"[^>]*/>', '', c)
              c = re.sub(r'<text[^>]*>.*?</text>', '', c, flags=re.DOTALL)
              open(p, 'w').write(c)
          "

      - name: Commit & Push 3D Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/
          git diff --staged --quiet || git commit -m "chore(telemetry): update 3D progress tracker"
          git push
