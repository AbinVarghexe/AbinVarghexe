<svg width="800" height="96" viewBox="0 0 800 96" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Flowing Electric Neon Gradient -->
    <linearGradient id="footerGrad_dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#60A5FA;#93C5FD;#3B82F6" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#60A5FA;#93C5FD;#3B82F6;#60A5FA" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#93C5FD;#60A5FA;#3B82F6" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Cyberpunk Glitch & Neon Glow Filter -->
    <filter id="cyberGlow_dark" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* GitAscii Glitch Keyframes (Authentic from gitascii animationType: glitch) */
    @keyframes glitch-anim {
      0%, 88%, 100% {
        transform: translate(0, 0) skew(0deg);
        filter: none;
      }
      89% {
        transform: translate(-2px, 1px) skew(-1.5deg);
        filter: drop-shadow(-2px 0 #3B82F6) drop-shadow(2px 0 #60A5FA);
      }
      91% {
        transform: translate(2px, -1px) skew(1.5deg);
        filter: drop-shadow(2px 0 #60A5FA) drop-shadow(-2px 0 #3B82F6);
      }
      93% {
        transform: translate(-1px, 0) skew(-0.5deg);
        filter: drop-shadow(0 0 6px #93C5FD);
      }
      95% {
        transform: translate(0, 0) skew(0deg);
        filter: none;
      }
    }

    .glitch-footer {
      animation: glitch-anim 5s infinite ease-in-out;
      transform-origin: center center;
      transition: filter 0.3s ease, transform 0.3s ease;
      cursor: pointer;
    }

    .glitch-footer:hover {
      animation: none;
      transform: scale(1.02);
      filter: drop-shadow(0 0 14px #93C5FD) drop-shadow(0 0 28px #3B82F6);
    }
  </style>

  <!-- Interactive & Glitch Animated GitAscii Text -->
