<svg width="130" height="48" viewBox="0 0 130 48" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&amp;family=Inter:wght@500;600&amp;display=swap');
    * { box-sizing: border-box; }
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    .pill-container {
      transition: transform 0.2s ease;
    }
  </style>

  <defs>

    <linearGradient id="radar-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#111827" />
      <stop offset="45%" stop-color="#93C5FD" />
      <stop offset="65%" stop-color="#3B82F6" />
      <stop offset="85%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#60A5FA" />
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite" />
    </linearGradient>

  </defs>
  <a xlink:href="https://www.instagram.com/abeeeein/" href="https://www.instagram.com/abeeeein/" target="_blank" rel="noopener noreferrer">
