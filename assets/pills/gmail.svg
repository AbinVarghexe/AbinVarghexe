<svg width="98" height="48" viewBox="0 0 98 48" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&amp;family=Inter:wght@500;600&amp;display=swap');
    * { box-sizing: border-box; }
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    .pill-container {
      transition: transform 0.2s ease;
    }
  </style>

  <defs>

    <linearGradient id="radar-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#111827" />
      <stop offset="45%" stop-color="#93C5FD" />
      <stop offset="65%" stop-color="#3B82F6" />
      <stop offset="85%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#60A5FA" />
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite" />
    </linearGradient>

  </defs>
  <a xlink:href="mailto:toabinvarghese@gmail.com" href="mailto:toabinvarghese@gmail.com" target="_blank" rel="noopener noreferrer">
    <g class="pill-container">
      <!-- Outer rotating gradient border -->
      <rect x="2" y="2" width="94" height="44" rx="22" ry="22" fill="none" stroke="url(#radar-glow)" stroke-width="1.8" />

      <!-- Dark container background with subtle glow -->
      <rect x="3" y="3" width="92" height="42" rx="21" ry="21" fill="#081A36" />

      <!-- Inner highlight layer -->
      <rect x="3" y="3" width="92" height="42" rx="21" ry="21" fill="rgba(255,255,255,0.03)" />

      <!-- Icon -->
      <g transform="translate(16, 15)">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path class="anim-target" fill="#60A5FA" d="M1.5 4.5v9a1.5 1.5 0 0 0 1.5 1.5h1.5V8.25L9 11.25l4.5-3v6.75H15a1.5 1.5 0 0 0 1.5-1.5v-9L9 8.25 1.5 4.5z" style="animation-delay: 164ms; transform-origin: center;" /><path class="anim-target" fill="#93C5FD" d="M16.5 4.5V3A1.5 1.5 0 0 0 15 1.5h-1.5L9 4.5l4.5 3.75 3-3.75z" style="animation-delay: 191ms; transform-origin: center;" /><path class="anim-target" fill="#3B82F6" d="M1.5 4.5l3 3.75L9 4.5 4.5 1.5H3A1.5 1.5 0 0 0 1.5 3v1.5z" style="animation-delay: 218ms; transform-origin: center;" />
        </svg>
      </g>

      <!-- Label -->
      <text x="44" y="29" text-anchor="start" fill="#F5F5F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="0.2">Gmail</text>
    </g>
  </a>
</svg>