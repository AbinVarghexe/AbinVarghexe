      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <radialGradient id="gloss_cloudflare" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.35)" />
      <stop offset="50%" stop-color="rgba(96, 165, 250, 0.1)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <linearGradient id="border_cloudflare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(191, 219, 254, 0.7)" />
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.4)" />
    </linearGradient>
  </defs>

